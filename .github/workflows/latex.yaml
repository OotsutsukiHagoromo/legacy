name: Build PDF

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: xu-cheng/latex-action@v4
        with:
          root_file: legacy.tex
          args: -shell-escape

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: legacy.pdf
